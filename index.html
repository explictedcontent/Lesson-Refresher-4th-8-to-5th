<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Art Refresher — Interactive Lessons (4th → 5th Grade)</title>
<!--
  ============================================================================
  LANDING-PAGE TEMPLATE  ·  reuse this exact layout for any subject.
  To make a Math / Science / Social Studies page:
    1) Copy this file into that subject's folder and rename it index.html
    2) Change SUBJECT below (emoji, title, blurb, gradient if you like)
    3) Replace the LESSONS array with that subject's lessons + file names
  Everything else (styling, grid, hover, responsive layout) stays the same.
  ============================================================================
-->
<style>
  :root{
    --bg:#1d1f2b; --panel:#262a3b; --panel2:#2f3447; --ink:#f4f5fb;
    --muted:#a7adc4; --accent:#ff7a59; --accent2:#5bd1c4; --good:#7bd88f;
    --line:#3a4059; --warn:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none}
  h1,h2,h3{margin:0 0 .35em}

  #home{max-width:1000px;margin:0 auto;padding:28px 20px 64px}
  .hero{
    background:linear-gradient(135deg,#ff7a59,#ff5e93 55%,#9b5cff);
    border-radius:20px;padding:28px 30px;margin-bottom:24px;color:#fff;
  }
  .hero h1{font-size:32px;line-height:1.1}
  .hero p{margin:.5em 0 0;font-size:15px;opacity:.96;max-width:64ch;line-height:1.5}
  .herostats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
  .herostats .st{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700}

  .sectionlbl{display:flex;align-items:center;gap:10px;margin:26px 4px 12px}
  .sectionlbl h2{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent2)}
  .sectionlbl .rule{flex:1;height:1px;background:var(--line)}
  .sectionlbl .count{font-size:12px;color:var(--muted);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
    text-align:left;color:var(--ink);transition:transform .08s ease,border-color .15s ease,box-shadow .15s ease;
    display:flex;flex-direction:column;gap:8px;min-height:140px;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px #0006}
  .card .num{font-size:12px;color:var(--accent2);font-weight:800;letter-spacing:.08em}
  .card .ct{font-size:18px;font-weight:800;line-height:1.18}
  .card .ct .emo{margin-right:6px}
  .card .cd{font-size:13px;color:var(--muted);line-height:1.4;flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .chip{font-size:11px;background:var(--panel2);color:var(--muted);padding:3px 9px;
    border-radius:999px;border:1px solid var(--line);font-weight:700}
  .chip.go{background:#23311f;border-color:var(--good);color:#bdeccb}

  footer{max-width:1000px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:12.5px;line-height:1.6}
  footer code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#d8dcea}

  @media (max-width:560px){ .hero h1{font-size:26px} }
</style>
</head>
<body>
<main id="home">
  <div class="hero">
    <h1 id="heroTitle">🎨 Art Refresher Studio</h1>
    <p id="heroBlurb"></p>
    <div class="herostats" id="heroStats"></div>
  </div>

  <div id="sections"></div>
</main>

<footer>
  Tip: tap any lesson card to open it. Each lesson has a built-in 30–38&nbsp;minute timer, hands-on activities,
  a drawing pad that <b>auto-saves</b> (and saves again if the app closes), and a graded quiz with a parent answer key.
</footer>

<script>
/* ====== SUBJECT (change these 3 things to reuse for another subject) ====== */
const SUBJECT = {
  emoji: "🎨",
  title: "Art Refresher Studio",
  blurb: "Interactive art lessons for a 4th-grader heading into 5th grade. Each lesson walks through one step at a time with a built-in timer that fills a real 30–38 minutes — with games, a drawing pad you can actually draw on, and a quick quiz at the end. Pick a lesson to begin."
};

/* ====== LESSONS (swap this list for another subject) ====== */
const LESSONS = [
  {n:1, emoji:"🌈", title:"Color Mixing",        topic:"Color",   time:"30 min", group:"elements",
   file:"art-lesson-01-color-mixing.html",      desc:"Primary, secondary & complementary colors. Mix colors, play Mix-Match, and build a color wheel."},
  {n:2, emoji:"🔥", title:"Warm & Cool Colors",  topic:"Color",   time:"30 min", group:"elements",
   file:"art-lesson-02-warm-cool-colors.html",  desc:"Sort warm vs. cool colors, learn tints & shades, and paint a warm/cool scene."},
  {n:3, emoji:"🌗", title:"Value: Light & Shadow",topic:"Value",  time:"30 min", group:"elements",
   file:"art-lesson-03-value-light-shadow.html",desc:"Build a value scale, light a sphere, and shade a flat circle into a 3D ball."},
  {n:4, emoji:"✏️", title:"Line",                topic:"Line",    time:"38 min", group:"elements",
   file:"art-lesson-04-line.html",              desc:"Types of lines, expressive 'line moods', one-line contour drawing, and line textures."},
  {n:5, emoji:"🔷", title:"Shape & Form",         topic:"Form",    time:"38 min", group:"elements",
   file:"art-lesson-05-shape-form.html",        desc:"2D shapes vs. 3D forms. Sort geometric/organic and shade spheres, cubes & cones."},
  {n:6, emoji:"🪵", title:"Texture",              topic:"Texture", time:"38 min", group:"elements",
   file:"art-lesson-06-texture.html",           desc:"Real vs. visual texture. Match texture patterns and give creatures fur, scales & spikes."},
  {n:7, emoji:"🏞️", title:"Space",               topic:"Space",   time:"38 min", group:"elements",
   file:"art-lesson-07-space.html",             desc:"Near & far, foreground/background, overlapping, and positive vs. negative space."},
  {n:8, emoji:"⚖️", title:"Balance",             topic:"Balance", time:"38 min", group:"principles",
   file:"art-lesson-08-balance.html",           desc:"Symmetrical, asymmetrical & radial balance — with a live mirror & kaleidoscope drawing pad."},
];

const GROUPS = [
  {key:"elements",   label:"Elements of Art",   blurb:"the building blocks"},
  {key:"principles", label:"Principles of Art", blurb:"how to arrange them"},
];

/* ====== render ====== */
document.getElementById("heroTitle").textContent = SUBJECT.emoji + " " + SUBJECT.title;
document.getElementById("heroBlurb").textContent = SUBJECT.blurb;
const stats = document.getElementById("heroStats");
stats.innerHTML =
  `<div class="st">📚 ${LESSONS.length} lessons</div>`+
  `<div class="st">⏱ 30–38 min each</div>`+
  `<div class="st">🎯 Games + drawing + quiz</div>`;

const sections = document.getElementById("sections");
GROUPS.forEach(g=>{
  const items = LESSONS.filter(l=>l.group===g.key);
  if(!items.length) return;
  const head = document.createElement("div");
  head.className="sectionlbl";
  head.innerHTML = `<h2>✦ ${g.label}</h2><span class="rule"></span><span class="count">${items.length} · ${g.blurb}</span>`;
  sections.appendChild(head);
  const grid = document.createElement("div");
  grid.className="grid";
  items.forEach(l=>{
    const a = document.createElement("a");
    a.className="card"; a.href=l.file;
    a.innerHTML =
      `<div class="num">LESSON ${l.n}</div>
       <div class="ct"><span class="emo">${l.emoji}</span>${l.title}</div>
       <div class="cd">${l.desc}</div>
       <div class="chips"><span class="chip">${l.topic}</span><span class="chip">${l.time}</span><span class="chip go">Open →</span></div>`;
    grid.appendChild(a);
  });
  sections.appendChild(grid);
});
</script>
</body>
</html>
