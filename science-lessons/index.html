<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Science Lessons — Summer Refresher (4th → 5th Grade)</title>
<style>
  :root{
    --bg:#1d1f2b; --panel:#262a3b; --panel2:#2f3447; --ink:#f4f5fb;
    --muted:#a7adc4; --accent:#00b894; --accent2:#0984e3; --good:#7bd88f;
    --line:#3a4059;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  .page{max-width:1000px;margin:0 auto;padding:28px 20px 60px}

  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--accent);
    font-size:14px;font-weight:700;margin-bottom:20px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;transition:background .15s;
  }
  .back-link:hover{background:var(--panel2)}

  .hero{
    background:linear-gradient(135deg,#00b894,#0984e3 60%,#6c5ce7);
    border-radius:20px;padding:28px 30px;margin-bottom:24px;color:#fff;
  }
  .hero h1{font-size:28px;line-height:1.15;margin-bottom:6px}
  .hero p{font-size:14.5px;opacity:.93;max-width:64ch;line-height:1.6}

  .section-label{
    font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:36px}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:20px;display:flex;flex-direction:column;gap:10px;
    transition:transform .08s ease,border-color .15s ease;cursor:pointer;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card-top{display:flex;align-items:center;gap:12px}
  .lesson-badge{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:12px;font-weight:800;border-radius:10px;
    padding:6px 12px;white-space:nowrap;flex:none;
  }
  .card-title{font-size:17px;font-weight:700;line-height:1.25}
  .card-desc{font-size:13px;color:var(--muted);line-height:1.5}
  .topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .topic{
    font-size:11px;background:var(--panel2);color:var(--muted);
    padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  }
  .card-footer{
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--line);padding-top:10px;margin-top:2px;
  }
  .q-count{font-size:12px;color:var(--muted);font-weight:600}
  .start-btn{
    font-size:12px;font-weight:700;background:var(--accent);color:#fff;
    border:none;border-radius:8px;padding:6px 14px;cursor:pointer;
    font-family:inherit;transition:opacity .15s;
  }
  .start-btn:hover{opacity:.85}

  /* coming soon card */
  .card.soon{opacity:.5;cursor:default}
  .card.soon:hover{transform:none;border-color:var(--line)}
  .soon-badge{font-size:11px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;align-self:flex-start;margin-top:auto;}

  /* summary */
  .summary{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .summary h2{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--ink)}
  .sum-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .sum-row:last-child{border-bottom:none;padding-bottom:0}
  .sum-num{font-size:12px;font-weight:800;color:var(--accent);min-width:28px;padding-top:1px}
  .sum-body{}
  .sum-title{font-size:14px;font-weight:700}
  .sum-topics{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
</style>
</head>
<body>
<div class="page">

  <a class="back-link" href="../index.html">← All Subjects</a>

  <div class="hero">
    <h1>🔬 Science Lessons</h1>
    <p>Interactive science lessons for a 4th-grader heading into 5th grade. Each lesson has 35–37 questions with instant feedback, a live score tracker, and a downloadable results report so you can review any wrong answers afterward.</p>
  </div>

  <p class="section-label">Available Lessons</p>
  <div class="grid" id="lessonGrid"></div>

  <p class="section-label">Lesson Summary</p>
  <div class="summary" id="summary"></div>

</div>

<script>
const LESSONS = [
  {
    num: 1,
    title: 'The World of Science',
    desc: 'A broad introduction to science — from how scientists work to the basics of matter, life, and our solar system.',
    file: 'science-lesson-1.html',
    questions: 37,
    topics: ['Scientific Method','Lab Safety & Tools','States of Matter','Living Things','Earth & Space']
  },
  {
    num: 2,
    title: 'Earth, Life & Forces',
    desc: 'A deeper dive into how water moves, how ecosystems work, how living things adapt, and the physics of push and pull.',
    file: 'science-lesson-2.html',
    questions: 37,
    topics: ['Water Cycle','Ecosystems & Food Webs','Adaptations','Forces & Motion','Our Solar System']
  }
];

const COMING = [
  { num: 3, title: 'The Human Body', topics: ['Skeletal System','Muscles','Digestive System','Circulatory System','Respiratory System'] },
  { num: 4, title: 'Energy & Simple Machines', topics: ['Forms of Energy','Heat Transfer','Simple Machines','Work & Power','Electricity Basics'] },
  { num: 5, title: 'Earth\'s Systems', topics: ['Rock Cycle','Plate Tectonics','Weathering & Erosion','Natural Resources','Climate vs. Weather'] },
];

function buildGrid() {
  const grid = document.getElementById('lessonGrid');

  LESSONS.forEach(l => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="lesson-badge">Lesson ${l.num}</div>
        <div class="card-title">${l.title}</div>
      </div>
      <div class="card-desc">${l.desc}</div>
      <div class="topics">${l.topics.map(t => `<span class="topic">${t}</span>`).join('')}</div>
      <div class="card-footer">
        <span class="q-count">📝 ${l.questions} questions</span>
        <button class="start-btn">Start Lesson →</button>
      </div>`;
    card.addEventListener('click', () => { window.location.href = l.file; });
    grid.appendChild(card);
  });

  COMING.forEach(l => {
    const card = document.createElement('div');
    card.className = 'card soon';
    card.innerHTML = `
      <div class="card-top">
        <div class="lesson-badge">Lesson ${l.num}</div>
        <div class="card-title">${l.title}</div>
      </div>
      <div class="topics">${l.topics.map(t => `<span class="topic">${t}</span>`).join('')}</div>
      <div class="soon-badge">Coming Soon</div>`;
    grid.appendChild(card);
  });
}

function buildSummary() {
  const el = document.getElementById('summary');
  el.innerHTML = '<h2>All Science Lessons</h2>';
  [...LESSONS, ...COMING].forEach(l => {
    const row = document.createElement('div');
    row.className = 'sum-row';
    row.innerHTML = `
      <div class="sum-num">${l.num}.</div>
      <div class="sum-body">
        <div class="sum-title">${l.title}${l.file ? '' : ' <span style="font-size:11px;color:var(--muted);font-weight:400;">(coming soon)</span>'}</div>
        <div class="sum-topics">${l.topics.join(' · ')}</div>
      </div>`;
    el.appendChild(row);
  });
}

buildGrid();
buildSummary();
</script>
</body>
</html>
